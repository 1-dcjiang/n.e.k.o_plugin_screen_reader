[plugin]
id = "screen_reader"
name = "屏幕阅读器"
description = "让 YUI 看见电脑屏幕：全屏/前台窗口截屏（PNG 路径，可直接交视觉能力解读）、当前前台窗口识别（标题/进程/PID/尺寸）、可选 OCR 屏幕文字识别（需安装 Tesseract-OCR 引擎，未安装时自动降级为提供截图路径）。何时用：用户说'看看我屏幕/截个屏/屏幕上是什么/帮我看看这个界面/把这个弹窗文字读出来/识别屏幕上这段字'等需要查看或读取屏幕内容的请求时。安全边界：只在用户会话内按需截屏，不静默持续录制，不采集密码/验证码等敏感输入画面。"
short_description = "让 YUI 看见屏幕：全屏/窗口截图、前台窗口识别、可选 OCR 文字识别"
keywords = ["屏幕", "截图", "截屏", "screen", "capture", "screenshot", "窗口", "window", "ocr", "识别", "文字", "阅读", "reader", "视觉", "前台窗口", "看到屏幕"]
version = "0.1.0"
type = "plugin"
entry = "plugin.plugins.screen_reader:ScreenReaderPlugin"

[plugin.author]
name = "起诉人"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.store]
enabled = true

[plugin.ui]
enabled = true

[[plugin.ui.guide]]
id = "quickstart"
title = "使用说明"
entry = "docs/guide.md"
